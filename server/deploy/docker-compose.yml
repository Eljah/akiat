services:
  akiat:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      # Only local reverse-proxy may access port 8080.
      - "127.0.0.1:8080:8080"
    environment:
      AKIAT_BIND: 0.0.0.0
      AKIAT_ADMIN_USER: admin
      AKIAT_ADMIN_PASSWORD: ${AKIAT_ADMIN_PASSWORD:?set a strong password in .env}
      AKIAT_MCP_TOKEN: ${AKIAT_MCP_TOKEN:-}
      AKIAT_PUBLIC_URL: ${AKIAT_PUBLIC_URL:-https://your-domain.example}
      AKIAT_COVER_URL: ${AKIAT_COVER_URL:-https://your-domain.example/cover.jpg}
      AKIAT_LLM_BASE_URL: ${AKIAT_LLM_BASE_URL:-https://api.openai.com/v1}
      AKIAT_LLM_MODEL: ${AKIAT_LLM_MODEL:-}
      AKIAT_LLM_API_KEY: ${AKIAT_LLM_API_KEY:-}
      AKIAT_BRAVE_API_KEY: ${AKIAT_BRAVE_API_KEY:-}
      AKIAT_AUTOGENERATE: ${AKIAT_AUTOGENERATE:-false}
    volumes:
      - ../data:/app/data
    read_only: false
    security_opt:
      - no-new-privileges:true
