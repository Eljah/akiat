name: Java server Maven CI
on:
  push:
    paths:
      - 'server/**'
      - 'worker/**'
      - '.github/workflows/java-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'worker/**'
      - '.github/workflows/java-server.yml'

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Build and test
        run: mvn --batch-mode -ntp -f server/pom.xml clean verify
      - name: Save runnable server JAR
        uses: actions/upload-artifact@v4
        with:
          name: akiat-server-fatjar
          path: server/target/akiat-server-0.1.0-SNAPSHOT.jar
          retention-days: 30
      - name: Python worker static check
        run: python3 -m py_compile worker/silero_api_worker.py
