name: Static source checks
on:
  push:
    paths:
      - '**.py'
      - '**.ipynb'
      - '.github/workflows/static-check.yml'
  pull_request:
    paths:
      - '**.py'
      - '**.ipynb'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/validate_notebooks.py
